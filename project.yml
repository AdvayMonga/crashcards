# xcodegen spec — source of truth for the Xcode project.
# Regenerate with:  xcodegen generate
name: crashcards
options:
  bundleIdPrefix: com.advaymonga
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
# Only the app is meant to be run; the extensions ship inside it.
schemes:
  crashcards:
    build:
      targets:
        crashcards: all
        crashcardsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - crashcardsTests
    archive:
      config: Release

targets:
  crashcards:
    type: application
    platform: iOS
    sources:
      - path: crashcards
    info:
      path: crashcards/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.advaymonga.crashcards.gate
            # flashcards:// stays accepted so a Shortcut set up before the rename keeps working.
            CFBundleURLSchemes: [crashcards, flashcards]
    dependencies:
      - target: ShieldConfig
      - target: DeviceActivityMonitorExt
      - target: ShareExtension
    entitlements:
      path: crashcards/crashcards.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.advaymonga.crashcards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaymonga.crashcards
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crash Cards
        TARGETED_DEVICE_FAMILY: "1"                 # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  # Customizes the system block screen. Shares BlockingShared with the app.
  ShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfig
      - path: crashcards/BlockingShared.swift
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: ShieldConfig
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.advaymonga.crashcards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaymonga.crashcards.ShieldConfig

  # Re-applies the shield when an unlock window expires, with the app closed.
  DeviceActivityMonitorExt:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitorExt
      - path: crashcards/BlockingShared.swift
    info:
      path: DeviceActivityMonitorExt/Info.plist
      properties:
        CFBundleDisplayName: DeviceActivityMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: DeviceActivityMonitorExt/DeviceActivityMonitorExt.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.advaymonga.crashcards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaymonga.crashcards.DeviceActivityMonitor

  # Captures text shared from other apps; the app parses it, with a preview.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: crashcards/SharedInbox.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Crash Cards
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.advaymonga.crashcards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaymonga.crashcards.ShareExtension

  # Pure-logic tests: parsers, session state, links. No UI, no device behaviour.
  crashcardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: crashcards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaymonga.crashcards.Tests
        GENERATE_INFOPLIST_FILE: YES
