# xcodegen spec — source of truth for the Xcode project.
# Regenerate with:  xcodegen generate
name: Flashcards
options:
  bundleIdPrefix: com.advaymonga
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Flashcards:
    type: application
    platform: iOS
    sources:
      - path: Flashcards
    dependencies:
      - target: ShieldConfig
      - target: DeviceActivityMonitorExt
    entitlements:
      path: Flashcards/Flashcards.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.advaymonga.Flashcards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaymonga.Flashcards
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"                 # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used to hear your spoken answers during voice study."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Used to understand your spoken answers during voice study."

  # Customizes the system block screen. Shares BlockingShared with the app.
  ShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfig
      - path: Flashcards/BlockingShared.swift
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: ShieldConfig
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.advaymonga.Flashcards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaymonga.Flashcards.ShieldConfig

  # Re-applies the shield when an unlock window expires, with the app closed.
  DeviceActivityMonitorExt:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitorExt
      - path: Flashcards/BlockingShared.swift
    info:
      path: DeviceActivityMonitorExt/Info.plist
      properties:
        CFBundleDisplayName: DeviceActivityMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: DeviceActivityMonitorExt/DeviceActivityMonitorExt.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.advaymonga.Flashcards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaymonga.Flashcards.DeviceActivityMonitor
